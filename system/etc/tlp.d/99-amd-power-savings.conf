# Optimisations TLP pour AMD Ryzen AI 9 HX 370 & GPU Radeon 890M
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave

NVME_LINK_PS_ON_AC=default
NVME_LINK_PS_ON_BAT=1

WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

AHCI_RUNTIME_PM_ON_AC=on
AHCI_RUNTIME_PM_ON_BAT=auto

# Commutation automatique du profil de puissance matériel (TDP / Ventilateurs)
PLATFORM_PROFILE_ON_AC=balanced
PLATFORM_PROFILE_ON_BAT=quiet

# Économie d'énergie pour le contrôleur audio Intel/HDA
SOUND_POWER_SAVE_ON_AC=0
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y

# Fix pour la carte Wi-Fi MediaTek MT7922 (évite le plantage après la veille)
SUSPEND_MODULES="mt7921e"
